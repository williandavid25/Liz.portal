<!DOCTYPE html>

<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<style>
  /* Sin esto, cualquier elemento con width/height:100% Y padding a la vez
     queda mas ancho/alto que el propio 100% (el padding se suma aparte con
     el box-sizing por defecto) - eso es lo que corria #start-screen 20px
     hacia la derecha (100% + 20px de padding a cada lado = 40px de sobra),
     desalineando el emoji y el texto de "Toca para iniciar" del centro real
     de la pantalla. */
  *{box-sizing:border-box;}
  html, body { margin:0; height:100%; background:#000; overflow:hidden; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; }
  /* El archivo fue guardado desde un navegador con una barra auxiliar inyectada. */
  chatgpt-sidebar { display:none !important; }

  #main-title{
    position:fixed;top:96px;left:0;right:0;width:100%;
    font-size:2.6em;color:#FFFACD;white-space:nowrap;
    text-shadow:0 0 10px #FFD700,0 0 18px #FFA500;
    z-index:10;pointer-events:none;text-align:center;
    font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
  }
  @media (max-width:768px){
    #main-title{
      top:102px;
      left:50%;
      right:auto;
      width:calc(100% - 92px);
      transform:translateX(-50%);
      font-size:1.22em;
      white-space:normal;
      padding:0;
      line-height:1.12;
    }
  }

  #start-screen{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:#000;display:flex;justify-content:center;align-items:center;
    flex-direction:column;color:#fff;z-index:9999;padding:20px;cursor:pointer;
    transition:opacity .7s ease,visibility .7s ease;
  }
  #start-screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #start-heart{
    font-size:clamp(74px,23vmin,148px);line-height:1;display:block;
    filter:drop-shadow(0 0 14px rgba(255,215,0,.75)) drop-shadow(0 0 36px rgba(255,165,0,.38)) drop-shadow(0 0 66px rgba(218,165,32,.22));
    animation:latido 1.35s ease-in-out infinite;transform-origin:50% 55%;
  }
  @keyframes latido{
    0%,100%{transform:scale(1);}
    12%{transform:scale(1.15);}
    24%{transform:scale(1);}
    36%{transform:scale(1.07);}
    50%{transform:scale(1);}
  }
  #start-text{
    font-size:1.8em;color:#FFFACD;font-family:'Indie Flower','Bradley Hand','Segoe Script',cursive;
    text-shadow:0 0 7px #FFD700;text-align:center;
    margin-top:clamp(16px,3.5vh,28px);
    animation:parpadeo 2.2s ease-in-out infinite;
  }
  @keyframes parpadeo{0%,100%{opacity:.55;}50%{opacity:1;}}
  @media (prefers-reduced-motion:reduce){
    #start-heart,#start-text{animation:none;}
  }
</style>
</head>
<body>
<canvas id="c" data-engine="three.js r148" width="1860" height="915" style="width: 1488px; height: 732px;"></canvas>

<h1 id="main-title">Feliz Día de las Flores Amarillas 🌻</h1>

<div id="start-screen" class="hidden" style="display: none;">
  <div id="start-heart" aria-hidden="true">🌻</div>
  <div id="start-text">Toca para iniciar</div>
</div>

<audio id="audio" loop="" preload="none">
  <source src="/video-portada.mp4" type="audio/mp4">
</audio>

<script src="./Galaxia Simple - Agujero Negro, Día de las Flores Amarillas_files/three.min.js.descargar"></script>

<!-- DEDICA:CONFIG -->
<script>
const DEFAULTS = {
  titulo: "Feliz Día de las Flores Amarillas 🌻",
  frases: [
    "🌻 Como el girasol, miro hacia ti","🌼 Gracias por ser mi sol de siempre","🌻 Contigo hasta lo simple brilla",
    "🌼 Hoy el amarillo lleva tu nombre","🌻 Esta flor te recuerda cuánto vales","🌼 Tu amistad, mi lugar favorito",
    "🌻 21 de septiembre, contigo siempre","🌼 Un girasol para quien ilumina","🌻 Gracias por quedarte siempre",
    "🌼 Contigo el día pesa menos","🌻 Un gracias que no necesita fecha","🌼 Tu risa le hace bien a mis días",
    "🌻 Hoy celebro tenerte cerca","🌼 Apareces cuando más hace falta","🌻 Pétalos dorados solo para ti",
    "🌼 Feliz día, pienso en ti con cariño","🌻 Contigo todo lugar es bonito","🌼 Un ramo de gracias por estar ahí",
    "🌻 Que esta flor te alcance hoy","🌼 Miras lo bueno, como el girasol","🌻 El campo entero te manda saludos",
    "🌼 Tu cariño no pasa de moda","🌻 Contigo las tardes se hacen cortas","🌼 Esta flor guarda un abrazo para ti",
    "🌻 No necesito un motivo para quererte","🌼 Quiero que sepas cuánto importas","🌻 El amarillo también dice te quiero",
    "🌼 Gracias por sumar luz a mis días","🌻 Aquí siempre tienes un lugar","🌼 Feliz día, contigo todo es mejor"
  ],
  fotos: [],
  musica: "/video-portada.mp4"
};
const CONFIG=(window.DEDICA&&window.DEDICA.merge)?window.DEDICA.merge(DEFAULTS,window.DEDICA.config):DEFAULTS;
</script>

<script>
// ================= Título fijo + música (arranca recién al tocar) =================
document.getElementById('main-title').textContent=CONFIG.titulo;
const audio=document.getElementById('audio');
audio.querySelector('source').src=CONFIG.musica;

// ================= Escena =================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.setSize(innerWidth,innerHeight);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,5000);
let targetDist=300,currentDist=300,rotX=0.2,rotY=0;

// Fondo: negro solido + el campo de estrellas generado abajo. La textura
// de nebulosa externa que traia el archivo original apuntaba a una URL de
// GitHub que ya no existe (404 - nunca se veia, ni siquiera antes de este
// cambio) - se quita en vez de dejar una dependencia externa rota.

// Estrellas
(function makeStars(count=2000,spread=3000){
  const g=new THREE.BufferGeometry();
  const pos=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const r=spread*(0.3+Math.random()*0.7);
    const th=Math.random()*Math.PI*2;
    const ph=Math.acos(2*Math.random()-1);
    pos[i*3+0]=r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1]=r*Math.cos(ph);
    pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);
  }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.5,color:0xffffff,depthWrite:false})));
})();

// Núcleo tipo "agujero negro" (oscuro y opaco, para que el anillo resalte por contraste)
const coreMat=new THREE.MeshPhongMaterial({color:0x030303,transparent:true,opacity:0.92,shininess:30});
const core=new THREE.Mesh(new THREE.SphereGeometry(40,64,64),coreMat);
scene.add(core);

// El título ahora vive en la cabecera fija (#main-title, ver DEDICA:CONFIG
// mas arriba) en vez de un sprite 3D en el centro - mas legible y
// consistente con el resto del catalogo.

// Glow exterior (reducido, para que el anillo se note más)
const GLOW_BASE=360;
function makeGlow(size=768,c1='255,235,130',c2='255,180,0'){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');
  const grad=g.createRadialGradient(size/2,size/2,size*0.05,size/2,size/2,size*0.5);
  grad.addColorStop(0,'rgba('+c1+',0.55)');
  grad.addColorStop(0.5,'rgba('+c2+',0.25)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grad;g.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:makeGlow(),transparent:true,depthWrite:false}));
glow.scale.set(GLOW_BASE,GLOW_BASE,1);
scene.add(glow);

// Anillo único (antes eran 3 anillos separados con huecos reales entre
// ellos). Sigue siendo un solo disco continuo (42-116, sin huecos), pero
// ahora con textura de franjas finas superpuestas al degradado de base -
// como los anillos de Saturno, que se ven "en capas" por dentro sin
// separarse en piezas distintas.
function ringTexture(size=1024){
  const c=document.createElement('canvas');c.width=c.height=size;
  const g=c.getContext('2d');g.translate(size/2,size/2);
  const rInner=size*0.205,rOuter=size*0.49;
  // Base: un solo degradado continuo de borde a borde, sin apagarse hacia
  // el borde exterior, para que el anillo se vea denso y solido.
  const grd=g.createRadialGradient(0,0,rInner,0,0,rOuter);
  grd.addColorStop(0.00,'rgba(255,255,245,1)');
  grd.addColorStop(0.30,'rgba(255,235,120,1)');
  grd.addColorStop(0.65,'rgba(255,200,40,0.95)');
  grd.addColorStop(1.00,'rgba(255,160,0,0.85)');
  g.fillStyle=grd;
  g.beginPath();g.arc(0,0,rOuter,0,Math.PI*2);g.arc(0,0,rInner,0,Math.PI*2,true);g.closePath();g.fill();

  // Franjas concentricas finas por encima del degradado base - varian el
  // brillo (mas claras u oscuras), nunca la opacidad hasta 0, asi que no
  // dejan huecos ni se leen como anillos separados, solo como textura.
  const bandCount=26;
  for(let i=0;i<bandCount;i++){
    const r=rInner+(rOuter-rInner)*(i/(bandCount-1));
    const dark=i%3===0;
    g.beginPath();
    g.arc(0,0,r,0,Math.PI*2);
    g.lineWidth=(rOuter-rInner)/bandCount*(0.55+Math.random()*0.35);
    g.strokeStyle=dark?'rgba(110,60,0,0.20)':'rgba(255,255,225,0.16)';
    g.stroke();
  }
  return new THREE.CanvasTexture(c);
}
const ringSystem=new THREE.Group();
ringSystem.rotation.x=Math.PI/2;
ringSystem.rotation.z=-0.12;
scene.add(ringSystem);
const ring=new THREE.Mesh(new THREE.RingGeometry(42,116,160),new THREE.MeshBasicMaterial({map:ringTexture(),transparent:true,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,opacity:1}));
ringSystem.add(ring);
const innerRing=new THREE.Mesh(new THREE.RingGeometry(40,49,160),new THREE.MeshBasicMaterial({color:0xffffc0,transparent:true,opacity:.7,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
innerRing.position.z=2;
ringSystem.add(innerRing);
const outerRing=new THREE.Mesh(new THREE.RingGeometry(113,132,160),new THREE.MeshBasicMaterial({color:0xffa51c,transparent:true,opacity:.3,side:THREE.DoubleSide,blending:THREE.AdditiveBlending}));
outerRing.position.z=-2;
ringSystem.add(outerRing);
const ringDust=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0xffe98a,size:2.2,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false}));
const dustPositions=new Float32Array(360*3);
for(let i=0;i<360;i++){
  const angle=Math.random()*Math.PI*2;
  const radius=48+Math.random()*78;
  dustPositions[i*3]=Math.cos(angle)*radius;
  dustPositions[i*3+1]=Math.sin(angle)*radius;
  dustPositions[i*3+2]=(Math.random()-.5)*4;
}
ringDust.geometry.setAttribute('position',new THREE.BufferAttribute(dustPositions,3));
ringDust.position.z=3;
ringSystem.add(ringDust);

// Palabras alrededor: frases del Día de las Flores Amarillas (min 1, se repiten
// ciclicamente hasta llenar las 150 posiciones que la escena ya reserva,
// sin importar cuántas haya dejado el cliente - ver schema.json).
const frasesBase=(Array.isArray(CONFIG.frases)&&CONFIG.frases.length)?CONFIG.frases:DEFAULTS.frases;
const WORD_SLOTS=150;
const WORDS=Array.from({length:WORD_SLOTS},(_,i)=>frasesBase[i%frasesBase.length]);
function makeTextTexture(text,color){
  const c=document.createElement('canvas');c.width=512;c.height=128;
  const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillStyle='#fff';ctx.shadowColor=color;ctx.shadowBlur=30;
  // Antes el tamaño de fuente era fijo (60px) sin importar el largo de la
  // frase - una frase larga (con emoji, que ya de por si ocupa bastante
  // ancho) se salia del lienzo de 512px y quedaba cortada a la mitad. Ahora
  // el tamaño se reduce hasta que la frase completa entra, con un piso de
  // 24px para que no se vuelva ilegible.
  const maxWidth=c.width-48;
  let fontSize=60;
  ctx.font=fontSize+"px 'Indie Flower', cursive";
  while(ctx.measureText(text).width>maxWidth&&fontSize>24){
    fontSize-=2;
    ctx.font=fontSize+"px 'Indie Flower', cursive";
  }
  ctx.fillText(text,c.width/2,c.height/2);
  return new THREE.CanvasTexture(c);
}
const COLORS=['#ffd700','#ffe066','#ffcc33','#ffb347','#fff2b0','#ffaa00','#f4c430','#e6b800','#ffdb58','#f0c419'];
const textGroup=new THREE.Group();scene.add(textGroup);
// Se espera a que 'Indie Flower' termine de cargar antes de dibujar las
// frases en canvas - a diferencia del texto normal del DOM (el navegador ya
// resuelve el "parpadeo" de fuente por su cuenta), un canvas dibuja con la
// fuente que este disponible EN ESE INSTANTE: sin esto, las 150 frases
// quedaban grabadas para siempre con la tipografia de respaldo (Arial) si
// la fuente todavia no habia terminado de bajar en el momento exacto en que
// corria este bucle.
// Las 150 frases solo tienen ~30 combinaciones distintas de texto y color
// (se repiten en ciclo): cada combinacion se dibuja UNA vez y sus copias
// comparten textura y material. Antes eran 150 texturas de 512x128 (~38 MB de
// memoria grafica); en un celular de gama baja eso, sumado al oceano, hacia
// que el navegador cerrara la pagina. Se ven exactamente igual (la opacidad
// que se anima es la misma para todas).
const textMats=new Map();
function textMaterial(text,color){
  const key=text+'|'+color;
  let mat=textMats.get(key);
  if(!mat){
    mat=new THREE.SpriteMaterial({map:makeTextTexture(text,color),transparent:true});
    textMats.set(key,mat);
  }
  return mat;
}
document.fonts.load("40px 'Indie Flower'").catch(()=>{}).then(()=>{
  for(let i=0;i<WORDS.length;i++){
    const mat=textMaterial(WORDS[i],COLORS[i%COLORS.length]);
    const sp=new THREE.Sprite(mat);
    sp.scale.set(68,21.8,1);
    const phi=Math.acos(2*Math.random()-1);const theta=Math.random()*Math.PI*2;
    const r=150+Math.random()*120;
    sp.position.set(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta));
    sp.userData={phi:phi,theta:theta,radius:r,speed:0.001+Math.random()*0.001};
    textGroup.add(sp);
  }
});

// Controles cámara — dirección corregida: ahora sigue el lado hacia donde deslizas
let dragging=false,lastX=0,lastY=0;
function onDown(e){dragging=true;const t=e.touches?e.touches[0]:e;lastX=t.clientX;lastY=t.clientY;}
function onMove(e){if(!dragging)return;const t=e.touches?e.touches[0]:e;const dx=(t.clientX-lastX)/innerWidth;const dy=(t.clientY-lastY)/innerHeight;rotY-=dx*5;rotX=Math.max(-1.2,Math.min(1.2,rotX+dy*3.5));lastX=t.clientX;lastY=t.clientY;}
function onUp(){dragging=false;}
addEventListener('mousedown',onDown);addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
addEventListener('touchstart',onDown,{passive:true});addEventListener('touchmove',onMove,{passive:true});addEventListener('touchend',onUp,{passive:true});
addEventListener('wheel',(e)=>{targetDist+=e.deltaY*0.25;targetDist=Math.max(160,Math.min(600,targetDist));},{passive:true});

// Zoom con pellizco en móviles
let pinch=0;
addEventListener('touchmove',(e)=>{
  if(e.touches && e.touches.length===2){
    e.preventDefault();
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    const d=Math.hypot(dx,dy);
    if(pinch){targetDist+=(pinch-d)*0.5;targetDist=Math.max(160,Math.min(600,targetDist));}
    pinch=d;
  }
},{passive:false});
addEventListener('touchend',()=>{pinch=0;},{passive:true});

// Animación
// Avanza segun el TIEMPO real, no por cuadro: los valores de abajo son los de
// siempre "por cuadro a 60 por segundo" multiplicados por f (cuantos cuadros
// de 60 fps pasaron). Antes, en un celular que dibuja a 30 por segundo todo
// giraba y latia a la mitad de velocidad; ahora se ve igual en cualquier equipo.
let t=0,ultimo=0,raf=0;
// Se detiene cuando no se ve: la pagina de inicio avisa (postMessage) cuando
// la galaxia sale de la pantalla, y el navegador cuando la app pasa a segundo plano.
let fueraDePantalla=false;
function activa(){return !fueraDePantalla&&document.visibilityState!=='hidden';}
function reanudar(){if(!raf&&activa()){ultimo=0;raf=requestAnimationFrame(tick);}}
addEventListener('message',(e)=>{
  if(e.origin!==location.origin||!e.data||typeof e.data.galaxia!=='string')return;
  fueraDePantalla=e.data.galaxia==='pausa';
  reanudar();
});
document.addEventListener('visibilitychange',reanudar);

// Resolucion adaptable: si el equipo no llega a ~45 cuadros por segundo se
// dibuja con menos pixeles (1.5 -> 1.25 -> 1). La animacion es la misma; solo
// baja un poco la nitidez en pantallas que de todos modos no la notan.
let pr=Math.min(window.devicePixelRatio||1,1.5);
const muestras=[];
function ajustarResolucion(dt){
  if(pr<=1)return;
  muestras.push(dt);
  if(muestras.length<90)return;
  const orden=muestras.slice().sort((a,b)=>a-b);
  muestras.length=0;
  if(orden[45]>22){
    pr=Math.max(1,pr-0.25);
    renderer.setPixelRatio(pr);
    renderer.setSize(innerWidth,innerHeight);
  }
}

function tick(now){
  if(!activa()){raf=0;return;}
  raf=requestAnimationFrame(tick);
  const dt=ultimo?Math.min(now-ultimo,100):1000/60;
  ultimo=now;
  ajustarResolucion(dt);
  const f=dt/(1000/60);
  t+=0.01*f;
  const ringPulse=1+Math.sin(t*1.7)*0.018;
  ringSystem.rotation.z+=0.0024*f;
  ringSystem.rotation.x=Math.PI/2+Math.sin(t*.45)*.045;
  ringSystem.rotation.y=Math.cos(t*.32)*.035;
  ringSystem.scale.set(ringPulse,1/ringPulse,1);
  innerRing.material.opacity=.56+Math.sin(t*2.2)*.16;
  outerRing.material.opacity=.24+Math.sin(t*1.4+.8)*.1;
  ringDust.rotation.z-=.0045*f;
  ringDust.material.opacity=.58+Math.sin(t*2.8)*.18;
  glow.scale.set(GLOW_BASE*(1+Math.sin(t*0.4)*0.03),GLOW_BASE*(1+Math.sin(t*0.4)*0.03),1);
  const s=1.0+0.05*Math.sin(t*3); // latido
  core.scale.set(s,s,s);
  const textOpacity=0.8+0.2*Math.sin(t*2);
  textMats.forEach(m=>{m.opacity=textOpacity;});
  const sprites=textGroup.children;
  for(let i=0;i<sprites.length;i++){
    const sp=sprites[i],d=sp.userData;
    d.theta+=d.speed*f;
    const rs=d.radius*Math.sin(d.phi);
    sp.position.x=rs*Math.cos(d.theta);
    sp.position.z=rs*Math.sin(d.theta);
  }
  currentDist+=(targetDist-currentDist)*(1-Math.pow(1-0.06,f));
  const cx=Math.cos(rotX),sx=Math.sin(rotX);const cy=Math.cos(rotY),sy=Math.sin(rotY);
  camera.position.set(currentDist*sy*cx,currentDist*sx,currentDist*cy*cx);camera.lookAt(0,0,0);
  renderer.render(scene,camera);
}
reanudar();

// ── Arranque: la musica recien empieza cuando se toca la pantalla ──
const startScreen=document.getElementById('start-screen');
function startExperience(){
  startScreen.classList.add('hidden');
  setTimeout(()=>startScreen.style.display='none',800);
  audio.play().catch(()=>{});
}
startScreen.addEventListener('click',startExperience);
</script>


</body>
</html>
